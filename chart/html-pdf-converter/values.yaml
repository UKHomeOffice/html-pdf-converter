replicaCount: 2

image:
  repository: quay.io/ukhomeofficedigital/html-pdf-converter
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env:
  APP_PORT: "8080"
  APP_HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  BODY_SIZE_LIMIT: "2mb"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

containerSecurityContext:
  runAsUser: 999
  runAsNonRoot: true

podSecurityContext:
  fsGroup: 999