# Default values (overridden/injected per-environment by the deployment pipeline)
replicaCount: 1
image:
  repository: "<aws-account-id>.dkr.ecr.eu-west-2.amazonaws.com/hof/html-pdf-converter"
  tag: "v3.1.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
env:
  APP_PORT: "8080"
  APP_HOST: "localhost"
  LOG_LEVEL: "info"
  BODY_SIZE_LIMIT: "2mb"
workload:
  baseName: "html-pdf-converter"
  branchName: ""
  branchScoped: false
  environment: ""
  replicas:
    default: 1
    prod: 2
platformLabels: {}
nginxProxy: {}
networkPolicy:
  enabled: false
  namespaceSelector:
    labelKey: "kubernetes.io/metadata.name"
    labelValue: ""
podSecurityContext: {}
containerSecurityContext: {}
resources: {}