apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "html-pdf-converter.deploymentName" . }}
  labels:
    {{- include "html-pdf-converter.labels" . | nindent 4 }}
    {{- include "html-pdf-converter.selectorLabels" . | nindent 4 }}
    {{- include "html-pdf-converter.platformMandatoryLabels" . | nindent 4 }}

spec:
  replicas: {{ include "html-pdf-converter.replicaCount" . | trim }}

  selector:
    matchLabels:
      {{- include "html-pdf-converter.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "html-pdf-converter.labels" . | nindent 8 }}
        {{- include "html-pdf-converter.selectorLabels" . | nindent 8 }}
        {{- include "html-pdf-converter.platformMandatoryLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:

        - name: html-pdf-converter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}

          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: http
              containerPort: {{ default 8080 .Values.containerPort }}
              protocol: TCP

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: {{ include "html-pdf-converter.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        {{- if .Values.nginxProxy.enabled }}
        - name: nginx-proxy
          image: {{ .Values.nginxProxy.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.nginxProxy.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ default 8443 .Values.nginxProxy.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.nginxProxy.resources | nindent 12 }}
        {{- end }}
          