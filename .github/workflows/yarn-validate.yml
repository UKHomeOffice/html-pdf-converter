name: Yarn CI - Setup, Lint, Unit Tests, Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # will run the audit, lint and testing actions
  validation:
    uses: Home-Office-Digital/core-cloud-workflow-node-yarn-actions/.github/workflows/validation.yml@1.3.1
    with:
      working_directory: "."
      node_version: "24.19.0"
      audit_level: "high"
      post_install_script: "yarn test"
        