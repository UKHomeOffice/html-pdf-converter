name: Building and scanning Docker images

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master
      - "CCL-*"
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-scan:
    permissions:
      contents: read
      id-token: write

    uses: Home-Office-Digital/core-cloud-workflow-docker-actions/.github/workflows/build-scan-push.yml@1.5.0

    with:
      working_directory: "."
      dockerfile: "Dockerfile"

      image_name: "hof/html-pdf-converter"

      image_tag: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || github.ref_name }}"

      tag_latest: ${{ github.ref == 'refs/heads/master' }}

    secrets:
      AWS_ECR_ACCOUNT_ID: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
      ROLE_TO_ASSUME: ${{ startsWith(secrets.ROLE_TO_ASSUME, 'arn:aws:iam::') && secrets.ROLE_TO_ASSUME || format('arn:aws:iam::{0}:role/{1}', secrets.AWS_ECR_ACCOUNT_ID, secrets.ROLE_TO_ASSUME) }}